<style>

.login{display:block;max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}.lbar{padding:14px 18px;background:var(--card)}.lbar .logo b{color:var(--navy)}.lhero{background:linear-gradient(160deg,#0b2a66,#06173d);color:#fff;padding:22px 18px 46px;border-bottom:6px solid var(--gold);border-radius:0 0 50% 50%/0 0 30px 30px}.lh1{display:flex;gap:12px;align-items:center}.lh1 .art{width:42%;flex:none}.lhero h1{font-size:clamp(26px,7vw,36px);line-height:1.1}.choose{padding:22px 18px 30px}
.page{max-width:1000px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}.main{flex:1}
.tb{background:#0b2a66;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.tb .logo small{color:#fff}

.herob{background:linear-gradient(120deg,var(--card),var(--soft));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow:hidden}.herob h2{font-size:clamp(22px,6vw,30px)}.art{width:clamp(90px,28vw,150px);flex:none}
.tag{background:var(--gold);color:#111;font-weight:700;font-size:11px;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:8px}.ul{width:44px;height:3px;background:var(--gold);margin:8px 0}
.ov{background:var(--navy);color:#fff;border-radius:16px;padding:14px 14px 0;margin:16px 0 34px}.ovi{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;display:flex;justify-content:space-around;margin-top:12px;transform:translateY(20px);box-shadow:0 4px 14px #0002}
.cgrid{grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.cgrid{grid-template-columns:repeat(3,1fr)}}
.cc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);text-align:left;width:100%}.cc .bd{width:50px;height:50px;border-radius:50%;background:var(--navy);color:#fff;border:3px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}.cc .ar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.cls{display:flex;align-items:center;gap:8px;text-align:left;border-radius:14px;padding:14px}.cls i{margin-left:auto;font-style:normal}
.rk-head{background:var(--navy);color:#fff;padding:14px 16px;border-radius:14px 14px 0 0;font-family:Fraunces,serif;font-size:18px}.rk{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden}.rkr{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;color:var(--ink);text-align:left;border-radius:0}.rkr:first-child{border-top:0}.medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--soft);flex:none}.m1{background:#f5b800;color:#111}.m2{background:#c9ced8;color:#111}.m3{background:#d9904f;color:#fff}
.ft{text-align:center;font-family:Fraunces,serif;font-style:italic;color:#fff;background:var(--navy);padding:26px 10px 18px;margin-top:20px;border-top:6px solid var(--gold);border-radius:50% 50% 0 0/24px 24px 0 0}
.lg{height:56px;width:auto;background:#fff;border-radius:10px;padding:3px;display:block}.lbar .lg{height:72px;padding:0}.ph{width:clamp(110px,36vw,240px);height:clamp(110px,30vw,180px);object-fit:cover;object-position:center 25%;border-radius:14px;border:3px solid var(--gold);flex:none}.lh1 .ph{width:46%;height:auto;aspect-ratio:3/2}
.toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;opacity:0;transition:.3s}.toast.on{opacity:1}
@media(max-width:760px){.login{grid-template-columns:1fr}.hero{padding:28px 20px 50px}.hero h1{font-size:30px}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}.side .logo{display:none}.nav{white-space:nowrap}.main{padding:14px}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast">Saved</div>
<script>
const $=s=>document.querySelector(s);
const DEF_SUBJ=["English Language","Mathematics","Basic Science","Social Studies","Civic Education","Computer Studies","Business Studies"];
const CLASSES=["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"];
let S=null,role=null,view='dashboard',cls='JSS 1',sid=null,tab='results',q='',me=null,dbDoc=null,lastJson='',timer=null;

/* ===== CLOUD STORAGE (Firebase Realtime Database + Email/Password sign-in) =====
   Paste your two Firebase values below. Leave them empty to run in demo mode. */
const CFG={apiKey:'',databaseURL:''};   // e.g. databaseURL:'https://your-project-default-rtdb.firebaseio.com'
const FB=!!(CFG.apiKey&&CFG.databaseURL);
let tok=null,tokExp=0,rtok=null;
const J={'Content-Type':'application/json'};
async function fbSignIn(email,password){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CFG.apiKey,{method:'POST',headers:J,body:JSON.stringify({email,password,returnSecureToken:true})});const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||'ERR');tok=d.idToken;rtok=d.refreshToken;tokExp=Date.now()+(+d.expiresIn-120)*1000}
async function fbToken(){if(tok&&Date.now()<tokExp)return tok;if(!rtok)return null;const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rtok)});const d=await r.json();if(!r.ok)return null;tok=d.id_token;rtok=d.refresh_token;tokExp=Date.now()+(+d.expires_in-120)*1000;return tok}
async function fbLoad(){const r=await fetch(CFG.databaseURL.replace(/\/$/,'')+'/records.json');if(!r.ok)throw new Error('load');return r.json()}
async function fbSave(j){const t=await fbToken();if(!t)throw new Error('auth');const r=await fetch(CFG.databaseURL.replace(/\/$/,'')+'/records.json?auth='+t,{method:'PUT',headers:J,body:JSON.stringify({json:j})});if(!r.ok)throw new Error('save')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bright-path-data-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Data exported')}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students||!d.grading)throw 0;if(!confirm('Replace ALL current data with this file?'))return;S=migrate(d);persist(1);render();toast('Data imported')}catch(e){toast('That file is not valid')}};r.readAsText(f)}
function logout(){role=null;tok=null;rtok=null;tokExp=0;render()}
async function poll(){if(role==='staff'&&(timer||/INPUT|SELECT/.test((document.activeElement||{}).tagName||'')))return;try{const d=await fbLoad();if(d&&d.json&&d.json!==lastJson&&!timer){lastJson=d.json;S=migrate(JSON.parse(d.json));render()}}catch(e){}}
async function staffLogin(){const e=$('#em').value.trim(),p=$('#pw').value,m=$('#aerr');if(!e||!p){m.textContent='Enter your email and password.';return}m.textContent='Signing in…';
  try{await fbSignIn(e,p)}catch(x){m.textContent=/EMAIL|PASSWORD|CREDENTIALS|USER/.test(x.message)?'Wrong email or password.':'Could not sign in. Check your connection.';return}
  try{const d=await fbLoad();if(d&&d.json&&d.json!==lastJson){lastJson=d.json;S=migrate(JSON.parse(d.json))}}catch(_){}enter('staff')}
const staffBox=()=>FB?`<input id="em" type="email" placeholder="Staff email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')staffLogin()"><button class="btn" onclick="staffLogin()">SIGN IN TO STAFF PORTAL →</button><small id="aerr" style="color:#c0392b;min-height:14px"></small>`:`<button class="btn" onclick="enter('staff')">ENTER STAFF PORTAL →</button>`;
function seed(){
  return{v:2,subj:{junior:[],art:[],commercial:[],science:[]},grading:{ca1:20,ca2:20,ex:60,bounds:[{g:'A',min:70,r:'Very Good'},{g:'B',min:60,r:'Good'},{g:'C',min:50,r:'Average'},{g:'D',min:45,r:'Fair'},{g:'E',min:0,r:'Poor'}]},students:[]};
}
/* storage: shared db doc, falls back to localStorage */
async function initStore(){
  if(FB){$('#root').innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--mut)">Loading records…</div>';
    try{const d=await fbLoad();if(d&&d.json){lastJson=d.json;S=migrate(JSON.parse(d.json))}else{S=seed();S.students=[]}}
    catch(e){try{const l=localStorage.getItem('bpa-records-v2');S=l?migrate(JSON.parse(l)):seed()}catch(_){S=seed()}toast('Offline – showing last saved copy')}
    render();setInterval(poll,30000);return}
  try{const l=localStorage.getItem('bpa-records-v2');S=migrate(l?JSON.parse(l):seed())}catch(e){S=seed()}
  render();
  try{const c=window.claude&&await claude.use("db");if(c){dbDoc=c.doc("app/records2");
    dbDoc.onSnapshot(sn=>{const d=sn.exists&&sn.data();if(d&&d.json){if(d.json!==lastJson){lastJson=d.json;S=migrate(JSON.parse(d.json));render()}}else persist(true)},()=>{})}}catch(e){}
}
function persist(now){clearTimeout(timer);const go=async()=>{const j=JSON.stringify(S);lastJson=j;try{localStorage.setItem('bpa-records-v2',j)}catch(e){}
  if(FB){try{await fbSave(j);toast('Saved to cloud')}catch(e){toast(tok||rtok?'Save failed – check connection':'Sign in as staff to save')}}else if(dbDoc){try{await dbDoc.set({json:j});toast('Saved')}catch(e){toast('Saved on this device only')}}else toast('Saved on this device')};
  now?go():timer=setTimeout(go,600)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}

/* grading */
const num=v=>v===''||v==null?null:+v;
function migrate(d){const g=d.grading;if(d.subjects){d.subj={junior:d.subjects,art:[],commercial:[],science:[]};delete d.subjects}d.students.forEach(s=>{if(!s.cls.startsWith('JSS')&&!s.track)s.track='science'});if(g.ca!=null){g.ca1=20;g.ca2=20;delete g.ca}d.students.forEach(s=>s.rows.forEach(r=>{if('ca' in r){const c=num(r.ca);r.ca1=c==null?'':Math.ceil(c/2);r.ca2=c==null?'':Math.floor(c/2);delete r.ca}}));return d}
const grade=t=>{if(t==null)return{g:'–',r:''};const b=[...S.grading.bounds].sort((a,b)=>b.min-a.min).find(b=>t>=b.min)||S.grading.bounds.at(-1);return{g:b.g,r:b.r}};
const total=r=>(num(r.ca1)==null&&num(r.ca2)==null&&num(r.ex)==null)?null:(num(r.ca1)||0)+(num(r.ca2)||0)+(num(r.ex)||0);
function avg(st){const t=st.rows.map(total).filter(x=>x!=null);return t.length?t.reduce((a,b)=>a+b,0)/t.length:null}
function pos(st){const m=S.students.filter(x=>x.cls===st.cls).map(avg).filter(x=>x!=null).sort((a,b)=>b-a);const a=avg(st);if(a==null)return'–';const p=m.indexOf(a)+1;return p+(['th','st','nd','rd'][p%100>10&&p%100<14?0:p%10]||'th')}
const f1=x=>x==null?'–':x.toFixed(1);

const logo=`<img class="lg" onclick="logout()" style="cursor:pointer" title="Home" src="${IMG.logo}" alt="Bright Path Academy">`;
const art=(()=>{let r='';for(let i=0;i<9;i++){const a=(-170+i*20)*Math.PI/180;r+=`<line x1="${60+27*Math.cos(a)}" y1="${46+27*Math.sin(a)}" x2="${60+37*Math.cos(a)}" y2="${46+37*Math.sin(a)}" stroke="#f5b800" stroke-width="4" stroke-linecap="round"/>`}
return`<svg viewBox="0 0 120 100" class="art">${r}<circle cx="60" cy="46" r="20" fill="#f5b800"/><path d="M10 80L60 91L110 80V71L60 82L10 71Z" fill="#fff" stroke="#f5b800" stroke-width="3"/><path d="M42 60v11q18 9 36 0V60L60 68Z" fill="#143a85"/><polygon points="60,38 98,53 60,68 22,53" fill="#0b2a66" stroke="#fff" stroke-width="1.5"/><path d="M94 55v15" stroke="#f5b800" stroke-width="3"/></svg>`})();
const feats=`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:600">${[['📊','Track Performance'],['👥','Manage Records'],['🛡️','Secure & Reliable']].map(([i,t])=>`<span style="display:flex;gap:6px;align-items:center"><span class="ico" style="width:30px;height:30px;font-size:14px;border:2px solid var(--gold)">${i}</span>${t}</span>`).join('')}</div>`;
/* views */
function loginView(){return`<div class="login"><div class="lbar">${logo}</div><div class="lhero"><div class="lh1"><img class="ph" src="${IMG.home}" alt=""><div><h1>Your Academic Journey, Organized<span style="color:var(--gold)">.</span></h1><p style="opacity:.9;margin:8px 0 0">Access student records, track performance, and keep every class on the right path.</p></div></div>${feats}</div>
<div class="choose"><div><h2>Choose Your Portal</h2><p style="color:var(--mut)">Select how you want to access the academy's student records.</p></div>
<div class="card opt"><div class="row"><div class="ico">🛡️</div><div><b style="font-family:Fraunces,serif;font-size:20px">Staff Login</b><div style="color:var(--mut);font-size:13px">Manage student records, enter scores, edit results, and update academic information.</div></div></div>${staffBox()}</div>
<div class="card opt"><div class="row"><div class="ico g">📖</div><div><b style="font-family:Fraunces,serif;font-size:20px">Student Login</b><div style="color:var(--mut);font-size:13px">View your personal academic records and grades. No editing allowed.</div></div></div><button class="btn gold" onclick="enter('student')">VIEW MY RECORDS →</button></div></div></div>`}
function enter(r){role=r;view=r==='staff'?'dashboard':'pick';sid=null;render()}
function shell(inner){const st=role==='staff';const items=[['dashboard','🏠','Dashboard'],['classes','🎓','Classes'],['subjects','👥','Subjects'],['reports','📄','Reports'],['settings','⚙️','Settings']];
return`<div class="page"><header class="tb">${logo}<button class="pill" style="background:var(--gold);color:#111" onclick="logout()">⏻ Logout</button></header>${st?`<nav class="nv">${items.map(([k,i,l])=>`<button class="np ${view===k?'on':''}" onclick="go('${k}')">${i} ${l}</button>`).join('')}</nav>`:''}<div class="main" style="width:100%">${st&&view!=='dashboard'?searchBar():''}${inner}</div><footer class="ft">Together towards a brighter future</footer></div>`}
const searchBar=()=>`<div class="gs"><input id="gs" autocomplete="off" placeholder="🔍 Search a student by name or reg no. to view or edit…" oninput="gsearch(this.value)" onkeydown="if(event.key=='Enter'){const b=document.querySelector('.gri');b&&b.click()}"><div id="gres"></div></div>`;
function gsearch(v){const r=$('#gres');v=v.trim().toLowerCase();if(!v){r.style.display='none';return}const l=S.students.filter(s=>s.name.toLowerCase().includes(v)||s.reg.toLowerCase().includes(v)).slice(0,8);r.innerHTML=l.map(s=>`<button class="gri" onclick="openStudent('${s.id}')"><span>${esc(s.name)}</span><small>${s.cls} · ${esc(s.reg)}</small></button>`).join('')||'<div style="padding:12px;color:var(--mut)">No student found</div>';r.style.display='block'}
function go(v){view=v;sid=null;q='';render()}
const hdr=(t,sub)=>`<div class="herob"><div><span class="tag">${role==='staff'?'STAFF PORTAL':'STUDENT PORTAL'}</span><h2>${t}</h2><div class="ul"></div><div style="color:var(--mut)">${sub||''}</div></div><img class="ph" src="${role==='staff'?IMG.stu:IMG.staff}" alt=""></div>`;

function dashboard(){const n=S.students.length,sc=Object.values(S.subj).flat().length;
return`<div class="herob"><div><div style="color:var(--mut)">Welcome back,</div><h2 style="font-size:clamp(28px,8vw,40px)">Staff</h2><div class="ul"></div><div style="color:var(--mut)">Pick a class or search for a student to get started.</div>${feats}</div><img class="ph" src="${IMG.stu}" alt=""></div>${searchBar()}
<div class="ov"><b style="font-family:Fraunces,serif;font-size:19px">Welcome, Staff</b><div style="opacity:.85">Here's a quick overview of your academy</div><div class="ovi"><div class="stat"><div class="ico" style="background:var(--soft)">🎓</div><div>Students<b>${n}</b></div></div><div class="stat"><div class="ico" style="background:var(--soft)">📖</div><div>Subjects<b>${sc}</b></div></div></div></div>
<div style="display:flex;gap:10px;align-items:center;margin:8px 0 12px"><div class="ico g" style="border-radius:12px">📖</div><div><h3 style="font-size:20px">Classes</h3><div style="color:var(--mut)">Select a class to view students</div></div></div>
<div class="grid cgrid">${CLASSES.map(c=>`<button class="cc" onclick="cls='${c}';go('classes')"><span class="bd">${c}</span><span><b>${c}</b><br><small style="color:var(--mut)">👥 ${S.students.filter(s=>s.cls===c).length} students</small></span><span class="ar">›</span></button>`).join('')}</div>`}

function classes(){const J=isJ(cls),list=S.students.filter(s=>s.cls===cls&&(J||tk(s)===trk));
return hdr('Classes','Tap a name to open or close their grades')+`<div class="grid g3">${CLASSES.map(c=>`<button class="cls ${c===cls?'on':''}" onclick="cls='${c}';render()">🎓 ${c}<i>›</i></button>`).join('')}</div>
${J?'':`<div class="tabs" style="margin-top:14px">${Object.entries(TRK).map(([k,l])=>`<button class="tab ${k===trk?'on':''}" onclick="trk='${k}';render()">${l}</button>`).join('')}</div>`}
<div class="top" style="margin-top:16px"><h3 style="font-size:17px">${cls}${J?'':' · '+TRK[trk]} · ${list.length} students</h3><button class="btn sm" onclick="addStudent()">+ Add student</button></div>${list.map(x=>card(x,true)).join('')||'<p style="color:var(--mut)">No students yet.</p>'}`}

function students(){const list=S.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
return hdr('All Students','Grouped by class')+`<input placeholder="Search…" value="${esc(q)}" oninput="q=this.value;render(true)" id="srch" style="margin-bottom:12px">${CLASSES.map(c=>{const l=list.filter(s=>s.cls===c);return`<div class="card" style="margin-bottom:10px"><b>${c}</b> <span class="pill">${l.length}</span><div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${l.map(s=>`<button class="btn ghost sm" onclick="openStudent('${s.id}')">${esc(s.name)}</button>`).join('')||'<span style="color:var(--mut)">–</span>'}</div></div>`}).join('')}`}

let opened=new Set(),trk='science';
const TRK={art:'Art',commercial:'Commercial',science:'Science'},GROUPS=[['junior','JSS 1 – JSS 3'],['art','SS 1 – SS 3 · Art'],['commercial','SS 1 – SS 3 · Commercial'],['science','SS 1 – SS 3 · Science']];
const isJ=c=>c.startsWith('JSS'),tk=s=>s.track||'science',grp=(c,t)=>isJ(c)?'junior':(t||'science');
function openStudent(id){const st=S.students.find(x=>x.id===id);opened.add(id);cls=st.cls;if(!isJ(cls))trk=tk(st);view=role==='staff'?'classes':'pick';q='';render();setTimeout(()=>{const e=$('#w'+id);e&&e.scrollIntoView({block:'center',behavior:'smooth'})},60)}
function tog(id){opened.has(id)?opened.delete(id):opened.add(id);const st=S.students.find(x=>x.id===id);$('#w'+id).outerHTML=card(st,role==='staff')}
const cell=(id,i,r,k,m,ed)=>`<td>${ed?`<input class="n" type="number" min="0" max="${m}" value="${r[k]}" oninput="upd('${id}',${i},'${k}',this.value,this)">`:(r[k]===''?'–':r[k])}</td>`;
function card(s,ed){const o=opened.has(s.id);return`<div class="acc" id="w${s.id}"><button class="acch" onclick="tog('${s.id}')"><span><b>${esc(s.name)}</b><small>${s.gender} · ${esc(s.reg)}${isJ(s.cls)?'':' · '+TRK[tk(s)]}</small></span><span><span class="pill" id="av${s.id}">Avg ${f1(avg(s))}</span> <i>${o?'▴':'▾'}</i></span></button>${o?`<div class="accb">${sheet(s,ed)}</div>`:''}</div>`}
function sheet(s,ed){const G=S.grading,id=s.id;
const rows=s.rows.map((r,i)=>{const t=total(r),g=grade(t);return`<tr><td>${i+1}</td><td>${ed?`<input class="t" value="${esc(r.s)}" onchange="upd('${id}',${i},'s',this.value)">`:esc(r.s)}</td>${cell(id,i,r,'ca1',G.ca1,ed)}${cell(id,i,r,'ca2',G.ca2,ed)}${cell(id,i,r,'ex',G.ex,ed)}<td id="t${id}_${i}"><b>${t==null?'–':t}</b></td><td id="g${id}_${i}">${t==null?'–':gc(g.g)}</td><td id="r${id}_${i}">${g.r}</td>${ed?`<td><button class="btn ghost sm" onclick="delRow('${id}',${i})">✕</button></td>`:''}</tr>`}).join('');
const edit=ed?`<button class="btn ghost sm" onclick="addRow('${id}')">+ Subject</button> <details style="display:inline-block;vertical-align:top"><summary class="btn ghost sm" style="list-style:none;display:inline-block">Edit details</summary><div class="grid g3" style="margin-top:8px;min-width:min(520px,80vw)"><label>Name<input value="${esc(s.name)}" onchange="prof('${id}','name',this.value)"></label><label>Gender<select onchange="prof('${id}','gender',this.value)"><option ${s.gender=='Male'?'selected':''}>Male</option><option ${s.gender=='Female'?'selected':''}>Female</option></select></label><label>Class<select onchange="prof('${id}','cls',this.value)">${CLASSES.map(c=>`<option ${c==s.cls?'selected':''}>${c}</option>`).join('')}</select></label><label>Reg No<input value="${esc(s.reg)}" onchange="prof('${id}','reg',this.value)"></label>${isJ(s.cls)?'':`<label>Track<select onchange="prof('${id}','track',this.value)">${Object.entries(TRK).map(([k,l])=>`<option value="${k}" ${k==tk(s)?'selected':''}>${l}</option>`).join('')}</select></label>`}</div><button class="btn red sm" style="margin-top:8px" onclick="delStudent('${id}')">Delete student</button></details>`:'';
return`<div class="sum">Average <b id="avg${id}">${f1(avg(s))}%</b> · Position <b id="pos${id}">${pos(s)}</b></div><div class="tw"><table><tr><th>S/N</th><th>Subject</th><th>CA1 (${G.ca1})</th><th>CA2 (${G.ca2})</th><th>Exam (${G.ex})</th><th>Total</th><th>Grade</th><th>Remark</th>${ed?'<th></th>':''}</tr>${rows}</table></div><div style="margin-top:10px">${edit}</div>`}

function reports(){const l=S.students.filter(s=>s.cls===cls).map(s=>({s,a:avg(s)})).sort((x,y)=>(y.a??-1)-(x.a??-1));
return hdr('Track Performance & Celebrate Progress','View class rankings and academic records.')+`<h3 style="margin-bottom:10px">Select Class</h3><div class="grid g3">${CLASSES.map(c=>`<button class="cls ${c===cls?'on':''}" onclick="cls='${c}';render()">🎓 ${c}<i>›</i></button>`).join('')}</div><div style="margin-top:18px"><div class="rk-head">🏆 Class Ranking (${cls})</div><div class="rk">${l.map((x,i)=>`<button class="rkr" onclick="openStudent('${x.s.id}')"><span class="medal ${x.a!=null&&i<3?'m'+(i+1):''}">${x.a==null?'–':i+1}</span><span style="flex:1">${esc(x.s.name)}</span><b>${f1(x.a)}</b></button>`).join('')||'<p style="padding:14px;color:var(--mut)">No students.</p>'}</div></div>`}

function subjects(){return hdr('Subjects','Subjects listed here are added automatically to every new student in that group')+GROUPS.map(([k,l])=>`<div class="card" style="margin-bottom:12px"><h3 style="font-size:16px;margin-bottom:10px">${l}</h3>${S.subj[k].map((x,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px"><input value="${esc(x)}" style="flex:1" onchange="S.subj['${k}'][${i}]=this.value;persist()"><button class="btn ghost sm" onclick="S.subj['${k}'].splice(${i},1);persist(1);render()">✕</button></div>`).join('')||'<p style="color:var(--mut)">No subjects yet.</p>'}<button class="btn sm" onclick="addSubj('${k}')">+ Add subject</button></div>`).join('')+'<p style="color:var(--mut)">A new subject is also added to existing students in that group. Renaming or removing here only affects students added later; you can still add or edit subjects on any individual student.</p>'}
function addSubj(k){const n=(prompt('Subject name?')||'').trim();if(!n)return;S.subj[k].push(n);S.students.forEach(st=>{if(grp(st.cls,st.track)===k&&!st.rows.some(r=>r.s===n))st.rows.push({s:n,ca1:'',ca2:'',ex:''})});persist(1);render()}

function settings(){const G=S.grading;
return hdr('Grading Parameters','Set the score categories and grade boundaries')+`<div class="card"><h3 style="font-size:16px;margin-bottom:10px">Score Categories</h3><div class="grid g3"><label>CA 1 (marks)<input type="number" value="${G.ca1}" onchange="G_set('ca1',this.value)"></label><label>CA 2 (marks)<input type="number" value="${G.ca2}" onchange="G_set('ca2',this.value)"></label><label>Exam (marks)<input type="number" value="${G.ex}" onchange="G_set('ex',this.value)"></label><label>Total<input disabled value="${G.ca1+G.ca2+G.ex}"></label></div></div>
<div class="card" style="margin-top:12px"><h3 style="font-size:16px;margin-bottom:10px">Grade Boundaries</h3><div class="tw"><table><tr><th>Grade</th><th>Minimum score</th><th>Remark</th><th></th></tr>${G.bounds.map((b,i)=>`<tr><td><input class="n" value="${esc(b.g)}" onchange="B_set(${i},'g',this.value)"></td><td><input class="n" type="number" value="${b.min}" onchange="B_set(${i},'min',+this.value)"></td><td><input value="${esc(b.r)}" onchange="B_set(${i},'r',this.value)"></td><td><button class="btn ghost sm" onclick="S.grading.bounds.splice(${i},1);persist(1);render()">✕</button></td></tr>`).join('')}</table></div><button class="btn sm" style="margin-top:10px" onclick="S.grading.bounds.push({g:'F',min:0,r:''});persist(1);render()">+ Add grade</button> <button class="btn ghost sm" onclick="if(confirm('Remove all demo students and scores?')){S.students=[];persist(1);render()}">Clear all students</button></div><div class="card" style="margin-top:12px"><h3 style="font-size:16px;margin-bottom:6px">Backup</h3><p style="color:var(--mut);margin:6px 0 10px">Save all names, subjects and grades to a file, or load a saved file back in.</p><button class="btn sm" onclick="exportData()">⬇ Export data</button> <label class="btn ghost sm" style="display:inline-block;cursor:pointer">⬆ Import data<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label></div><p style="color:var(--mut)">Totals, grades, remarks, averages and positions update automatically.</p>`}
const G_set=(k,v)=>{S.grading[k]=+v;persist(1);render()},B_set=(i,k,v)=>{S.grading.bounds[i][k]=v;persist(1);render()};

function pick(){const l=S.students.filter(s=>s.cls===cls);
return hdr('Track Your Progress','Choose your class, then tap your name to see your results.')+`<h3 style="margin-bottom:10px">Select Class</h3><div class="grid g3">${CLASSES.map(c=>`<button class="cls ${c===cls?'on':''}" onclick="cls='${c}';render()">🎓 ${c}<i>›</i></button>`).join('')}</div><div style="margin-top:18px"><div class="rk-head">👥 ${cls} Students</div><div class="rk">${l.map((x,i)=>`<button class="rkr" onclick="showResult('${x.id}')"><span class="medal">${i+1}</span><span style="flex:1"><b>${esc(x.name)}</b>${isJ(x.cls)?'':`<small style="color:var(--mut)"> · ${TRK[tk(x)]}</small>`}</span><span class="pill">View results ›</span></button>`).join('')||'<p style="padding:14px;color:var(--mut)">No students in this class yet.</p>'}</div></div>`}

function showResult(id){sid=id;cls=S.students.find(x=>x.id===id).cls;view='result';render();scrollTo(0,0)}
function resultView(){const s=S.students.find(x=>x.id===sid);if(!s){view='pick';return render()}const G=S.grading,a=avg(s);
const rows=s.rows.map(r=>{const t=total(r),g=grade(t),v=x=>x===''?'–':x;return`<tr><td>${esc(r.s)}</td><td>${v(r.ca1)}</td><td>${v(r.ca2)}</td><td>${v(r.ex)}</td><td><b>${t==null?'–':t}</b></td><td>${t==null?'–':gc(g.g)}</td><td class="rm">${g.r}</td></tr>`}).join('');
return`<div class="rs"><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn sm" onclick="view='pick';render()">← Return</button><span class="pill">🎓 View only</span></div>
<div><h2 style="font-size:clamp(18px,5vw,26px)">${esc(s.name)}</h2><div style="color:var(--mut)">${s.cls}${isJ(s.cls)?'':' · '+TRK[tk(s)]} · Reg No: ${esc(s.reg)}</div></div>
<div class="grid g3" style="grid-template-columns:repeat(3,1fr)"><div class="card rst">Average<b>${f1(a)}%</b></div><div class="card rst">Position<b>${pos(s)}</b></div><div class="card rst">Class<b>${s.cls}</b></div></div>
<div class="tw"><table><tr><th>Subject</th><th>CA1<br>(${G.ca1})</th><th>CA2<br>(${G.ca2})</th><th>Exam<br>(${G.ex})</th><th>Total</th><th>Grade</th><th class="rm">Remark</th></tr>${rows}</table></div></div>`}

/* mutations */
function upd(id,i,k,v,el){const s=S.students.find(x=>x.id===id),r=s.rows[i];
  if(el&&v!==''){const m=S.grading[k];if(+v>m){v=m;el.value=m}if(+v<0){v=0;el.value=0}}
  r[k]=v;persist();if(k=='s')return;
  const t=total(r),g=grade(t),a=avg(s);$('#t'+id+'_'+i).innerHTML=`<b>${t==null?'–':t}</b>`;$('#g'+id+'_'+i).innerHTML=t==null?'–':gc(g.g);$('#r'+id+'_'+i).textContent=g.r;
  $('#avg'+id).textContent=f1(a)+'%';$('#pos'+id).textContent=pos(s);$('#av'+id).textContent='Avg '+f1(a)}
const prof=(id,k,v)=>{S.students.find(x=>x.id===id)[k]=v;persist(1);render()};
const addRow=id=>{S.students.find(x=>x.id===id).rows.push({s:'New Subject',ca1:'',ca2:'',ex:''});persist(1);render()};
const delRow=(id,i)=>{S.students.find(x=>x.id===id).rows.splice(i,1);persist(1);render()};
function addStudent(ask){let c=cls;if(ask){const x=(prompt('Which class? '+CLASSES.join(', '),cls)||'').toUpperCase().replace(/\s/g,'');c=CLASSES.find(k=>k.replace(' ','')===x);if(!c)return toast('Class not recognised')}
  const name=prompt('Student full name?');if(!name)return;cls=c;const n=S.students.filter(x=>x.cls===c).length+1;
  const st={id:'s'+Date.now(),name,gender:'Male',cls:c,reg:`BAJ${c.replace(' ','')}/${String(n).padStart(3,'0')}`,track:isJ(c)?undefined:trk,rows:S.subj[grp(c,trk)].map(s=>({s,ca1:'',ca2:'',ex:''}))};
  S.students.push(st);persist(1);openStudent(st.id)}
function delStudent(id){if(confirm('Delete this student and all their scores?')){S.students=S.students.filter(x=>x.id!==id);opened.delete(id);persist(1);go('classes')}}

function render(keepFocus){if(!S)return;const R=$('#root');
  if(!role){R.innerHTML=loginView();return}
  if(role==='student'&&view==='result'){R.innerHTML=resultView();return}
  const v={dashboard,classes,students,subjects,reports,settings,pick}[view]||dashboard;
  R.innerHTML=shell(v());
  if(keepFocus){const e=$('#srch');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
initStore();
</script></body></html>
